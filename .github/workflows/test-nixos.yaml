env:
  REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPO_USERNAME: ${{ github.actor }}
  UMBRELLA_GIT: '1'
jobs:
  test-nixos:
    continue-on-error: true
    env:
      UMBRELLA_REV: ${{ needs.umbrella-rev.outputs.rev }}
    needs:
      - umbrella-rev
    runs-on: ubuntu-latest
    steps:
      - timeout-minutes: 10
        uses: actions/checkout@main
      - name: Make room on the runner
        run: df -h /; sudo rm -rf /usr/lib/jvm /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /usr/local/julia* /usr/local/lib/android /opt/az /usr/local/share/powershell /opt/hostedtoolcache /usr/local/share/chromium /opt/microsoft /opt/google /usr/lib/firefox; docker system prune --all --force; docker builder prune --all --force; df -h /
        timeout-minutes: 10
      - timeout-minutes: 15
        uses: cachix/install-nix-action@master
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}
            experimental-features = nix-command flakes
            sandbox = relaxed
            substituters = https://cache.nixos.org?priority=1 https://nixkube.cachix.org?priority=2 https://lillecarl.cachix.org?priority=3
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nixkube.cachix.org-1:H8UE0jlI9pxHexK/NhDmEoLDarJXp1WTymQrsajlh7M= lillecarl.cachix.org-1:NN/LLMg7mbyvZCu32Qlo8LpSHqNw7Rr3VBCEYQvRpT0=
            trusted-users = root runner
      - name: Build nixos test driver
        run: nix build --file . nixosTests.containerd.driverInteractive
      - name: Start nixos test (background)
        run: |
          # The nixos-test-driver uses XDG_RUNTIME_DIR as its temp dir and
          # propagates it to VM subprocesses automatically.  GHA's default
          # XDG_RUNTIME_DIR is /run/user/1001 (1.6 GB tmpfs) which fills up
          # quickly — redirect to the root filesystem (87 GB free) instead.
          mkdir -p /tmp/nixos-test-tmp
          XDG_RUNTIME_DIR=/tmp/nixos-test-tmp ./result/bin/nixos-test-driver --no-interactive > /tmp/test.log 2>&1 &
          echo $! > /tmp/test.pid
          echo "Test running in background (PID: $(cat /tmp/test.pid))"
          sleep 5
      - name: Print test logs
        run: |
          cat /tmp/test.log || true
      - name: Print test results
        run: |
          echo "=== Test log output ==="
          cat /tmp/test.log 2>/dev/null || echo "(no test log)"
    timeout-minutes: 60
  umbrella-rev:
    outputs:
      rev: ${{ steps.resolve.outputs.rev }}
    runs-on: ubuntu-24.04
    steps:
      - name: Make room on the runner
        run: df -h /; sudo rm -rf /usr/lib/jvm /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /usr/local/julia* /usr/local/lib/android /opt/az /usr/local/share/powershell /opt/hostedtoolcache /usr/local/share/chromium /opt/microsoft /opt/google /usr/lib/firefox; docker system prune --all --force; docker builder prune --all --force; df -h /
        timeout-minutes: 10
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - id: resolve
        name: Resolve the umbrella revision
        run: ci/walkback.sh https://github.com/nixidae/nixidae nixkube | sed 's/^/rev=/' >> "$GITHUB_OUTPUT"
    timeout-minutes: 5
'on':
  push:
    branches:
      - cidev
  workflow_dispatch: null
permissions:
  contents: read
