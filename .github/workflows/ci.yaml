# SPDX-License-Identifier: MIT
on:
  pull_request:
  push:
    branches:
      - '*'
      - '!cidev'
    tags:
      - 'v*'
  workflow_dispatch:
# One run per ref. A push to a branch cancels the run the previous push
# started, because that run is testing a commit nobody will deploy.
#
# Measured on 2026-09-09, after a day of small commits to develop: 22 runs
# unfinished at once and 18 concurrent build-arm64 jobs, each rebuilding the
# same 954 MiB aarch64 closure from source. None could help another, because
# `push` only runs after its own build finishes. Every one of those was a
# duplicate of the newest.
#
# Tags keep their runs. A release is not superseded by the next push, and
# cancelling one would leave a version half published.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
env:
  REPO_USERNAME: ${{ github.actor }}
  REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
permissions:
  contents: write
  packages: write
  actions: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Setup Nix environment
        uses: ./.github/actions/setup-nix
      - name: Run type checker
        run: nix-shell --run "pyright pkgs/nixkube/src"
      # Evaluation-only, and its closure is empty, so this costs seconds. It
      # renders a container with no volumeMounts to keep the hostPath+subPath
      # assertion working against easykubenix's submodule defaults, which
      # nixkube's own resources never produce.
      - name: Check the assertion against a consumer-shaped render
        run: nix build --show-trace --file . assertionsNullShape
      - name: Check that a neighbour's object is warned about, not refused
        run: nix build --show-trace --file . assertionsNeighbourScope
      # Also evaluation-only. Both of these encode a shape a consumer reported
      # and this repository's own instances cannot produce.
      - name: Check that an operator can cap builders
        run: nix build --show-trace --file . builderSettingsOverride
      - name: Check that nix-node reports a dead driver
        run: nix build --show-trace --file . nodeDriverReadiness
      # A runner has no binfmt, so an attribute that needs the other
      # architecture cannot be built by any job here. A workstation with
      # extra-platforms emulates it and says nothing, which is how
      # kubenixApply came to need 3120 aarch64 derivations on x86_64.
      #
      # Every attribute a job builds is here except `pushArch.aarch64-linux`,
      # which is foreign here on purpose and native on the runner that builds
      # it.
      #
      # `pushManifest` is the one most likely to regress. It names the two
      # architectures' images as plain strings today, so it costs nothing;
      # interpolating the derivations instead would read as a tidy-up and
      # would make `build-manifests` need an aarch64 machine.
      - name: Check that every CI attribute builds natively
        run: |
          nix run --file . arch-audit -- \
            push \
            push-ci2 \
            kubenixApply.manifestJSONFile \
            kubenixApply.manifestYAMLFile \
            kubenixCI1.deploymentScript \
            kubenixCI2.deploymentScript \
            kubenixCITest.deploymentScript \
            nixImage.pushArch.x86_64-linux \
            nixImage.pushManifest \
            scratchImage.push
      - name: Check formatting
        run: |
          nix run --file . treefmt
          git diff --exit-code
  build-amd64:
    runs-on: ubuntu-latest
    # Same reason as build-arm64 below, lower bound: this one has never been
    # the slow half.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Setup Nix environment
        uses: ./.github/actions/setup-nix
      - name: Build and push environments
        run: |
          unlink nix-envs || true
          nix build --show-trace --file . push --out-link nix-envs
          ./nix-envs/bin/push
      - name: Build and push amd64 nix image
        run: |
          unlink nix-nix || true
          nix build --show-trace --file . nixImage.pushArch.x86_64-linux --out-link nix-nix
          ./nix-nix/bin/push-nix-x86_64-linux
  build-arm64:
    runs-on: ubuntu-24.04-arm
    # Fail rather than hang. Measured on 2026-09-10: this job sat in "Build
    # and push environments" for three hours, and GitHub's default would have
    # let it reach six. `build-manifests` needs it, so everything downstream
    # -- both kind tests, the release -- waits behind a job that is not
    # progressing, and the whole run publishes nothing.
    #
    # It is not building from source when this happens. Measured the same
    # day: 3260 of 3265 paths in this job's aarch64 closure are already on a
    # substituter, and the five that are not came from unpushed commits. The
    # stall is in fetching, which is what issue #21 says.
    #
    # 90 minutes is well above a healthy run and well below the point where a
    # stuck job costs a day of pipeline.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Setup Nix environment
        uses: ./.github/actions/setup-nix
      # One derivation at a time, with every core. This is insurance, not the
      # fix for what killed this job.
      #
      # `max-jobs auto` lets a 4-core, 16 GB runner build four of nixkube's
      # Python packages at once; grpclib-ttrpc compiles a Go ttrpc test server
      # and runs its suite, and four more run grpcio-tools. That would be a
      # plausible cause and is not this one: the job stalls while *fetching*
      # from cachix, before it builds anything. See issue #21 and the note in
      # the setup-nix action.
      #
      # Kept because this runner has died twice, and the next path that lands
      # uncached will be built here rather than fetched.
      - name: Build and push environments
        run: |
          unlink nix-envs || true
          nix build --show-trace --max-jobs 1 --cores 4 --file . push --out-link nix-envs
          ./nix-envs/bin/push
      - name: Build and push arm64 nix image
        run: |
          unlink nix-nix || true
          nix build --show-trace --max-jobs 1 --cores 4 --file . nixImage.pushArch.aarch64-linux --out-link nix-nix
          ./nix-nix/bin/push-nix-aarch64-linux
  build-manifests:
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Setup Nix environment
        uses: ./.github/actions/setup-nix
      # Both build jobs have passed, so every store path the deployment names
      # should now be fetchable. Assert it before assembling the index rather
      # than after, because the index is what consumers pull.
      #
      # It walks the closure and unions the substituters. A per-path narinfo
      # check passes on the shape that actually bit: cacheEnv present on
      # cachix with a closure member only on cache.nixos.org, and issue #8's
      # present-top-path-absent-member.
      - name: Assert both architectures' closures are fetchable
        run: |
          nix build --show-trace --file . kubenixApply.manifestJSONFile --out-link manifest
          nix run --file . assert-cached -- manifest
      - name: Create nix multi-arch manifest
        run: |
          unlink nix-manifest || true
          nix build --show-trace --file . nixImage.pushManifest --out-link nix-manifest
          ./nix-manifest/bin/push-nix-manifest
      - name: Build and push scratch image
        run: |
          unlink nix-scratches || true
          nix build --show-trace --file . scratchImage.push --out-link nix-scratches
          ./nix-scratches/bin/push
      # Let this fail the job. The cache is load-bearing, not an optimisation:
      # a node cannot bring itself up without nodeEnv, and a node with no local
      # store cannot build one. A push that silently does nothing shows up days
      # later as a pod stuck in ContainerCreating, nowhere near this line.
      #
      # A fork has no token and cannot push. That case is skipped by name here,
      # rather than by discarding every error including the real ones.
      - name: Push nocache variant store paths
        if: env.CACHIX_AUTH_TOKEN != ''
        run: nix run --file . push-ci2
  test-kind-cache:
    needs: build-manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Setup Nix environment
        uses: ./.github/actions/setup-nix
      - name: Create Kind cluster
        uses: helm/kind-action@main
      - name: Clean runner
        run: |
          # Remove cache because permissions can get fucked up preventing kluctl from creating it's cache directory
          sudo rm --recursive --force /home/runner/.cache
      - name: Deploy nix-csi
        run: |
          nix build --show-trace --file . kubenixCI1.deploymentScript
          ./result/bin/kubenixDeploy --yes
      - name: Wait for nix-csi node daemonset
        run: |
          kubectl rollout status daemonset -l app.kubernetes.io/component=node -n nixkube --timeout=180s
      - name: Wait for nix-csi cache pod
        run: |
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/component=pynixd -n nixkube --timeout=180s
      - name: Deploy test workloads
        run: |
          nix build --show-trace --file . kubenixCITest.deploymentScript
          ./result/bin/kubenixDeploy --yes
      - name: Wait for test workload
        run: |
          kubectl wait --for=condition=complete job/flake-hello job/expr-hello job/path-hello job/env-ssl job/nri-hello-ro job/nri-hello-rw -n nixkube --timeout=300s
      - name: Delete jobs and verify CSI cleanup
        run: |
          kubectl delete job flake-hello expr-hello path-hello commandpath-hello env-ssl invalid-storepath-hello invalid-flake-hello invalid-expr-hello nri-hello-ro nri-hello-rw -n nixkube
          kubectl wait --for=delete pod -l "job-name in (flake-hello,expr-hello,path-hello,commandpath-hello,env-ssl,invalid-storepath-hello,invalid-flake-hello,invalid-expr-hello,nri-hello-ro,nri-hello-rw)" -n nixkube --timeout=120s
      - name: Debug on failure
        if: failure()
        env:
          DS_API: ${{ secrets.DS_API }}
        run: nix run --file . ci-debug 2>/dev/null || true
  test-kind-nocache:
    needs: build-manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Setup Nix environment
        uses: ./.github/actions/setup-nix
      - name: Create Kind cluster
        uses: helm/kind-action@main
      - name: Clean runner
        run: |
          sudo rm --recursive --force /home/runner/.cache
      - name: Deploy nix-csi
        run: |
          nix build --show-trace --file . kubenixCI2.deploymentScript
          ./result/bin/kubenixDeploy --yes
      - name: Wait for nix-csi node daemonset
        run: |
          kubectl rollout status daemonset -l app.kubernetes.io/component=node -n nixkube --timeout=180s
      - name: Deploy test workloads
        run: |
          nix build --show-trace --file . kubenixCITest.deploymentScript
          ./result/bin/kubenixDeploy --yes
      - name: Wait for test workload
        run: |
          kubectl wait --for=condition=complete job/flake-hello job/expr-hello job/path-hello job/env-ssl job/nri-hello-ro job/nri-hello-rw -n nixkube --timeout=300s
      - name: Delete jobs and verify CSI cleanup
        run: |
          kubectl delete job flake-hello expr-hello path-hello commandpath-hello env-ssl invalid-storepath-hello invalid-flake-hello invalid-expr-hello nri-hello-ro nri-hello-rw -n nixkube
          kubectl wait --for=delete pod -l "job-name in (flake-hello,expr-hello,path-hello,commandpath-hello,env-ssl,invalid-storepath-hello,invalid-flake-hello,invalid-expr-hello,nri-hello-ro,nri-hello-rw)" -n nixkube --timeout=120s
      - name: Debug on failure
        if: failure()
        env:
          DS_API: ${{ secrets.DS_API }}
        run: nix run --file . ci-debug 2>/dev/null || true
  docs-build:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: nixbuild/nix-quick-install-action@v35
      # nix-csi is the cache this repository owns, and the one every other job
      # pushes to. The token can push to it. A push to `lillecarl` answered
      # 403 "You're not authorized to access binary cache lillecarl."
      - uses: cachix/cachix-action@v15
        with:
          name: nix-csi
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          useDaemon: false
      - name: Build documentation
        run: nix build --file . nixkube-docs --out-link result --print-build-logs --print-out-paths
      - name: Verify docs closure
        run: nix store verify --recursive --no-trust "$(readlink -f result)"
      - name: Prepare Pages artifact
        run: |
          mkdir -p public
          cp -r --no-preserve=mode,ownership result/. public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  docs-deploy:
    if: github.ref == 'refs/heads/develop'
    needs: docs-build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  release:
    needs: [check, build-manifests, test-kind-cache, test-kind-nocache]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Setup Nix environment
        uses: ./.github/actions/setup-nix
      # A release YAML nobody has checked is deployable is how #3 and #4
      # reached users. Every path it names has to be fetchable, because a
      # node can only substitute them.
      - name: Render deployment manifest
        run: |
          nix build --show-trace --file . kubenixApply.manifestYAMLFile
          cp result nix-csi-deployment.yaml
      - name: Assert the release manifest is deployable
        run: nix run --file . assert-cached -- nix-csi-deployment.yaml
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: nix-csi-deployment.yaml
          draft: false
          prerelease: false
