concurrency:
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
  group: ${{ github.workflow }}-${{ github.ref }}
env:
  CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
  REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPO_USERNAME: ${{ github.actor }}
jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Setup Nix environment
        uses: ./.github/actions/setup-nix
      - name: Build and push environments
        run: "unlink nix-envs || true\nnix build --show-trace --print-build-logs --file . push --out-link nix-envs\n./nix-envs/bin/push\n"
      - name: Build amd64 nix image
        run: "unlink nix-nix || true\nnix build --show-trace --print-build-logs --file . nixImage.pushArch.x86_64-linux --out-link nix-nix\n"
      - if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v')
        name: Push amd64 nix image
        run: ./nix-nix/bin/push-nix-x86_64-linux
    timeout-minutes: 45
  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Setup Nix environment
        uses: ./.github/actions/setup-nix
      - name: Build and push environments
        run: "unlink nix-envs || true\nnix build --show-trace --print-build-logs --max-jobs 1 --cores 4 --file . push --out-link nix-envs\n./nix-envs/bin/push\n"
      - name: Build arm64 nix image
        run: "unlink nix-nix || true\nnix build --show-trace --print-build-logs --max-jobs 1 --cores 4 --file . nixImage.pushArch.aarch64-linux --out-link nix-nix\n"
      - if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v')
        name: Push arm64 nix image
        run: ./nix-nix/bin/push-nix-aarch64-linux
    timeout-minutes: 90
  build-manifests:
    needs:
      - build-amd64
      - build-arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Setup Nix environment
        uses: ./.github/actions/setup-nix
      - name: Assert both architectures' closures are fetchable
        run: "nix build --show-trace --file . kubenixApply.manifestJSONFile --out-link manifest\nnix run --file . assert-cached -- manifest\n"
      - name: Build the index and scratch publishers
        run: "unlink nix-manifest || true\nunlink nix-scratches || true\nnix build --show-trace --file . nixImage.pushManifest --out-link nix-manifest\nnix build --show-trace --file . scratchImage.push --out-link nix-scratches\n"
      - if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v')
        name: Create nix multi-arch manifest
        run: ./nix-manifest/bin/push-nix-manifest
      - if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v')
        name: Push scratch image
        run: ./nix-scratches/bin/push
      - if: env.CACHIX_AUTH_TOKEN != ''
        name: Push nocache variant store paths
        run: nix run --file . push-ci2
      - if: env.CACHIX_AUTH_TOKEN != ''
        name: Push test workload store paths
        run: nix run --file . push-citest
    timeout-minutes: 30
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Setup Nix environment
        uses: ./.github/actions/setup-nix
      - name: Run type checker
        run: nix develop --file shell.nix --command pyright pkgs/nixkube/src
      - name: Check the assertion against a consumer-shaped render
        run: nix build --show-trace --file . assertionsNullShape
      - name: Check that a neighbour's object is warned about, not refused
        run: nix build --show-trace --file . assertionsNeighbourScope
      - name: Check that an operator can cap builders
        run: nix build --show-trace --file . builderSettingsOverride
      - name: Check that nix-node reports a dead driver
        run: nix build --show-trace --file . nodeDriverReadiness
      - name: Check that a builder presents the host key the controller pins
        run: nix build --show-trace --file . builderPresentsPinnedHostKey
      - name: Check that every source is a fetched tree
        run: nix build --show-trace --file . sourcesAreLocked
      - name: Check that the committed workflow matches ci/workflows
        run: nix build --show-trace --file . ciWorkflowCheck
      - name: Check that every CI attribute builds natively
        run: "nix run --file . arch-audit -- \\\n  push \\\n  push-ci2 \\\n  push-citest \\\n  kubenixApply.manifestJSONFile \\\n  kubenixApply.manifestYAMLFile \\\n  kubenixCI1.deploymentScript \\\n  kubenixCI2.deploymentScript \\\n  kubenixCITest.deploymentScript \\\n  nixImage.pushArch.x86_64-linux \\\n  nixImage.pushManifest \\\n  scratchImage.push\n"
      - name: Check formatting
        run: "nix run --file . treefmt\ngit diff --exit-code\n"
    timeout-minutes: 30
  docs-build:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Nix environment
        uses: ./.github/actions/setup-nix
      - uses: cachix/cachix-action@v15
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: nix-csi
      - name: Build documentation
        run: nix build --file . nixkube-docs --out-link result --print-build-logs --print-out-paths
      - name: Verify docs closure
        run: nix store verify --recursive --no-trust "$(readlink -f result)"
      - name: Prepare Pages artifact
        run: "mkdir -p public\ncp -r --no-preserve=mode,ownership result/. public/\n"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
    timeout-minutes: 30
  docs-deploy:
    concurrency:
      cancel-in-progress: false
      group: pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: github.ref == 'refs/heads/develop'
    needs: docs-build
    permissions:
      id-token: write
      pages: write
    runs-on: ubuntu-24.04
    steps:
      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
    timeout-minutes: 15
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - check
      - build-manifests
      - test-kind-cache
      - test-kind-nocache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Setup Nix environment
        uses: ./.github/actions/setup-nix
      - name: Render deployment manifest
        run: "nix build --show-trace --file . kubenixApply.manifestYAMLFile\ncp result nix-csi-deployment.yaml\n"
      - name: Assert the release manifest is deployable
        run: nix run --file . assert-cached -- nix-csi-deployment.yaml
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          files: nix-csi-deployment.yaml
          prerelease: false
    timeout-minutes: 30
  test-kind-cache:
    needs: build-manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Setup Nix environment
        uses: ./.github/actions/setup-nix
      - name: Create Kind cluster
        uses: helm/kind-action@main
      - name: Clean runner
        run: "# Remove cache because permissions can get fucked up preventing kluctl from creating it's cache directory\nsudo rm --recursive --force /home/runner/.cache\n"
      - name: Deploy nix-csi
        run: "nix build --show-trace --file . kubenixCI1.deploymentScript\n./result/bin/kubenixDeploy --yes\n"
      - name: Wait for nix-csi node daemonset
        run: "kubectl rollout status daemonset -l app.kubernetes.io/component=node -n nixkube --timeout=180s\n"
      - name: Wait for nix-csi cache pod
        run: "kubectl wait --for=condition=ready pod -l app.kubernetes.io/component=pynixd -n nixkube --timeout=180s\n"
      - name: Deploy test workloads
        run: "nix build --show-trace --file . kubenixCITest.deploymentScript\n./result/bin/kubenixDeploy --yes\n"
      - name: Wait for test workload
        run: "kubectl wait --for=condition=complete job/flake-hello job/expr-hello job/path-hello job/env-ssl job/nri-hello-ro job/nri-hello-rw -n nixkube --timeout=300s\n"
      - name: Delete jobs and verify CSI cleanup
        run: "kubectl delete job flake-hello expr-hello path-hello commandpath-hello env-ssl invalid-storepath-hello invalid-flake-hello invalid-expr-hello nri-hello-ro nri-hello-rw -n nixkube\nkubectl wait --for=delete pod -l \"job-name in (flake-hello,expr-hello,path-hello,commandpath-hello,env-ssl,invalid-storepath-hello,invalid-flake-hello,invalid-expr-hello,nri-hello-ro,nri-hello-rw)\" -n nixkube --timeout=120s\n"
      - env:
          DS_API: ${{ secrets.DS_API }}
        if: failure()
        name: Debug on failure
        run: nix run --file . ci-debug 2>/dev/null || true
    timeout-minutes: 45
  test-kind-nocache:
    needs: build-manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Setup Nix environment
        uses: ./.github/actions/setup-nix
      - name: Create Kind cluster
        uses: helm/kind-action@main
      - name: Clean runner
        run: "sudo rm --recursive --force /home/runner/.cache\n"
      - name: Deploy nix-csi
        run: "nix build --show-trace --file . kubenixCI2.deploymentScript\n./result/bin/kubenixDeploy --yes\n"
      - name: Wait for nix-csi node daemonset
        run: "kubectl rollout status daemonset -l app.kubernetes.io/component=node -n nixkube --timeout=180s\n"
      - name: Deploy test workloads
        run: "nix build --show-trace --file . kubenixCITest.deploymentScript\n./result/bin/kubenixDeploy --yes\n"
      - name: Wait for test workload
        run: "kubectl wait --for=condition=complete job/flake-hello job/expr-hello job/path-hello job/env-ssl job/nri-hello-ro job/nri-hello-rw -n nixkube --timeout=300s\n"
      - name: Delete jobs and verify CSI cleanup
