# SPDX-License-Identifier: MIT
name: "Setup Nix & Caches"
description: "Installs Nix and sets up substituters"
runs:
  using: "composite"
  steps:
    - name: Install Nix
      # cachix/install-nix-action, which installs a daemon, and not
      # nixbuild/nix-quick-install-action, which does not.
      #
      # A daemon builds in its own sandbox, under /build. A single-user nix
      # builds under the runner's TMPDIR, and everything a derivation touches
      # then depends on where the checkout happens to be. That is not a
      # theoretical difference: it hung both builders for a day. The nri-wait
      # tests bind a unix socket, whose path holds 107 bytes, and the same
      # socket came to 77 bytes in the sandbox and 125 on the runner. See #23.
      #
      # So the sandbox is the point of this step, not the installer. It costs
      # roughly a minute more to install and buys a build that does not depend
      # on the runner's filesystem layout.
      #
      # No timeout on this step. A composite action's steps take only a
      # subset of the workflow step keys, and `timeout-minutes` is not in it:
      # the runner rejects the whole file at load, before any job starts.
      #
      #   Unexpected value 'timeout-minutes'
      #   Failed to load .github/actions/setup-nix/action.yaml
      #
      # That is every job, not only the one that wanted the bound, and it
      # costs about a minute per run rather than failing visibly in a build.
      # Every caller carries `timeout-minutes` at the job level instead.
      uses: cachix/install-nix-action@master
      with:
        # nixkube is the cache this repository owns. It replaced nix-csi,
        # which was the name before the module was renamed.
        #
        # lillecarl is the cache the other umbrella projects push to, and
        # it is here because this repository's closure contains theirs:
        # without it every job rebuilt nanopynix from source, which is
        # minutes on every run of every job. A read-only substituter costs
        # nothing when it misses.
        #
        # trusted-users, because a daemon ignores substituters and public keys
        # a non-trusted user asks for. Without it every path would come from
        # cache.nixos.org and everything of ours would build from source.
        #
        # No `extra-platforms`. Each architecture is built on a runner of that
        # architecture -- `build-arm64` is `ubuntu-24.04-arm` -- so nothing
        # here needs emulation, and permitting it only means an accidental
        # cross-architecture build runs for hours under qemu instead of
        # failing at once.
        extra_nix_config: |
          experimental-features = nix-command flakes
          trusted-users = root runner
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nixkube.cachix.org-1:H8UE0jlI9pxHexK/NhDmEoLDarJXp1WTymQrsajlh7M= lillecarl.cachix.org-1:NN/LLMg7mbyvZCu32Qlo8LpSHqNw7Rr3VBCEYQvRpT0=
          substituters = https://cache.nixos.org?priority=1 https://nixkube.cachix.org?priority=2 https://lillecarl.cachix.org?priority=3
  # No GitHub store cache. cachix is the cache.
  #
  # `nix-community/cache-nix-action` restored a whole /nix/store from the
  # GitHub cache at the start of every job, then GC'd and saved it again at
  # the end. On `ubuntu-24.04-arm`, which has roughly 14 GB free, that left
  # little room, and `build-arm64` stalled part-way through substituting
  # from cachix:
  #
  #   copying path '...-python3.14-grpclib-ttrpc-0.1.0' from 'https://nix-csi.cachix.org'...
  #   copying path '...-python3.14-grpclib-nri-0.1.0'   from 'https://nix-csi.cachix.org'...
  #   <no further output, then "the hosted runner lost communication">
  #
  # Two caches for the same paths is also work twice: cachix already holds
  # everything this restores, and it is fetched over the same network in the
  # same step. Keeping one of them is strictly better than keeping both, and
  # cachix is the one nodes read from as well. See issue #21.
