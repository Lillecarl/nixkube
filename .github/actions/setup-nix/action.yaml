# SPDX-License-Identifier: MIT
name: "Setup Nix & Caches"
description: "Installs Nix and sets up substituters"
runs:
  using: "composite"
  steps:
    - name: Install Nix
      uses: nixbuild/nix-quick-install-action@master
      with:
        # TODO: When ready to migrate from nix-csi to nixkube module naming:
        # - Update trusted-public-keys: nix-csi.cachix.org-1 → nixkube.cachix.org-1
        # - Update substituters: https://nix-csi.cachix.org → https://nixkube.cachix.org
        # - Recreate/migrate Cachix cache from nix-csi to nixkube
        # No `extra-platforms`. Each architecture is built on a runner of that
        # architecture -- `build-arm64` is `ubuntu-24.04-arm` -- so nothing
        # here needs emulation, and permitting it only means an accidental
        # cross-architecture build runs for hours under qemu instead of
        # failing at once.
        # `keep-env-derivations` and `keep-outputs` are gone with the GitHub
        # cache below. They existed to hold build-time outputs in the store so
        # that cache had something to save; on a runner with no store cache
        # they only make the store larger for no reader.
        nix_conf: |
          trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-csi.cachix.org-1:i4w33gR4efO67jpz8U7g/MdvRQ6mQ3LEF9fB8tES60g=
          substituters = https://cache.nixos.org?priority=1 https://nix-csi.cachix.org?priority=2
  # No GitHub store cache. cachix is the cache.
  #
  # `nix-community/cache-nix-action` restored a whole /nix/store from the
  # GitHub cache at the start of every job, then GC'd and saved it again at
  # the end. On `ubuntu-24.04-arm`, which has roughly 14 GB free, that left
  # little room, and `build-arm64` stalled part-way through substituting
  # from cachix:
  #
  #   copying path '...-python3.14-grpclib-ttrpc-0.1.0' from 'https://nix-csi.cachix.org'...
  #   copying path '...-python3.14-grpclib-nri-0.1.0'   from 'https://nix-csi.cachix.org'...
  #   <no further output, then "the hosted runner lost communication">
  #
  # Two caches for the same paths is also work twice: cachix already holds
  # everything this restores, and it is fetched over the same network in the
  # same step. Keeping one of them is strictly better than keeping both, and
  # cachix is the one nodes read from as well. See issue #21.
