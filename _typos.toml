# `typos` runs over this tree as one of treefmt's formatters (see the
# `programs.typos` line in default.nix).

[default]
extend-ignore-re = [
  # A Nix store hash: 32 characters of Nix's base32 alphabet, which omits
  # e, o, t and u. Any hash long enough contains a three-letter sequence that
  # looks like a misspelling of something -- the one that prompted this was
  # `...p6ba` in a comment in flake.nix, read as `by` or `be`.
  #
  # Matching the shape rather than excluding the file, because a hash can
  # appear in any comment and the next one will be somewhere else.
  "\\b[0-9a-df-np-sv-z]{32}\\b",
]
